global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot Application
  - job_name: 'chzscout'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'chzscout'
          environment: '${ENVIRONMENT:-prod}'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']